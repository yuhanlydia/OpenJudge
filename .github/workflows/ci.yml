name: Validate code
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r pipeline/requirements.lock
      - run: PYTHONPATH=pipeline python -m pytest pipeline/tests -q
      - run: python scripts/repository-guard.py
      - run: python -m unittest discover -s scripts/tests -q
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web exec tsc --noEmit
      - run: pnpm --dir apps/web build
      - run: python scripts/check-dist.py
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm --dir apps/web exec playwright test
      - run: node scripts/verify-ui-fixtures.mjs
      - name: Project path verification
        env:
          BASE_PATH: /OpenJudge/
        run: |
          pnpm --dir apps/web build
          node scripts/verify-static.mjs
