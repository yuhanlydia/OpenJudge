name: Publish approved static release
on:
  workflow_dispatch:
    inputs:
      authorize_public_release:
        description: 'I authorize public GitHub Pages publication of this reviewed commit'
        required: true
        type: boolean
        default: false
      base_path:
        description: 'Project path such as /OpenJudge/ (use / only for a root-domain site)'
        required: true
        type: string
        default: /OpenJudge/
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: inputs.authorize_public_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@11.25.0
      - run: python -m pip install -r pipeline/requirements.lock
      - run: PYTHONPATH=pipeline python -m pytest pipeline/tests -q
      - run: PYTHONPATH=pipeline python -m reviewcase validate-public --path data/public --mode production
      - run: pnpm install --frozen-lockfile
      - run: python scripts/repository-guard.py
      - run: pnpm --dir apps/web test
      - name: Root build for browser checks
        run: pnpm --dir apps/web build
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm --dir apps/web exec playwright test
      - name: Build selected Pages path
        env:
          BASE_PATH: ${{ inputs.base_path }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
        run: pnpm --dir apps/web build
      - name: Check selected Pages path
        env:
          BASE_PATH: ${{ inputs.base_path }}
        run: node scripts/verify-static.mjs
      - run: python scripts/check-dist.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
