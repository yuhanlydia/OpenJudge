name: Prepare quarterly candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r pipeline/requirements.lock
      - name: Discover public venue schema
        run: PYTHONPATH=pipeline python -m reviewcase discover --venue ICLR.cc/2026/Conference --out .cache/discovery
      - name: Capture public records
        run: PYTHONPATH=pipeline python -m reviewcase ingest --config config/iclr2026.yaml --out .cache/capture
      - name: Normalize and rank
        run: |
          PYTHONPATH=pipeline python -m reviewcase normalize --capture .cache/capture --config config/iclr2026.yaml --out .cache/normalized
          PYTHONPATH=pipeline python -m reviewcase rank --input .cache/normalized --out .cache/rankings
      - name: Export candidate only
        run: PYTHONPATH=pipeline python -m reviewcase export --input .cache/normalized --rankings .cache/rankings --out .cache/candidate
      - name: Gate candidate before public artifact upload
        run: PYTHONPATH=pipeline python -m reviewcase validate-public --path .cache/candidate --mode production
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewcase-quarterly-candidate
          path: .cache/candidate
          retention-days: 14
          if-no-files-found: error
